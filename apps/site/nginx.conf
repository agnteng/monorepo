# www answers with a redirect, so the site has one address.
server {
  listen 80;
  server_name www.agnteng.com;
  return 301 https://agnteng.com$request_uri;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Hashed build output.
  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/index.html $uri.html =404;
  }

  error_page 404 /404.html;
}
