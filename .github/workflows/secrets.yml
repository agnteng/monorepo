# Public repository: every push and pull request is scanned for credentials
# before anything else looks at it. GitHub's own secret scanning with push
# protection is also on for the repo; this catches patterns it does not.
name: secret-scan
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
